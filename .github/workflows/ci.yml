---
name: ci

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (fmt + clippy + test + corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        # Los tests de io_uring real fallan si io_uring_setup no está
        # permitido; no hay skips.
        run: cargo test --release
      - name: corpus (6/6 bugs, 0/6 FP)
        run: >-
          cargo run --release --bin uring-crash --
          corpus corpus/protocols.json corpus/expected.json
      - name: curva N=1..8
        run: cargo run --release --example curve 8

  asan:
    name: asan (nightly, build-std)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: test bajo AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: >-
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu
          --target-dir target/asan --tests
