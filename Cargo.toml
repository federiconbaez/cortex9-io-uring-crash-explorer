[package]
name = "uring-crash"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Explorador exhaustivo y acotado de estados de crash para protocolos de commit sobre io_uring"
repository = "https://github.com/federiconbaez/cortex9-io-uring-crash-explorer"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
io-uring = "0.7"
libc = "0.2"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
